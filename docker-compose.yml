version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-learnwithkryon_prod}
      - POSTGRES_USER=${DB_USER:-kryon_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-supersecretpassword}
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume:
